params:
    description: "Personal website of Bart Cox."
    author: Bart Cox
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: false
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    # MainSections: ["books","courses","papers","data"]
    MainSections: ["papers"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Bart Cox
          subtitle: "I am a PhD Student in the [Data Intensive Systems (DIS)](https://www.tudelft.nl/en/eemcs/the-faculty/departments/software-technology/data-intensive-systems) group at the TU Delft. My research focusses on Distributed Machine Learning  with a strong focus on Federated Learning, Distributed Systems, and Edge AI. I love building scalable,
            production-ready ML frameworks and optimizing models to run eﬃciently across
            diverse hardware environments.
            
            
            **email**: bart [at] bcox.nl"
          imageUrl: "img/bartcox-cropped.jpeg"
          imageWidth: 160
          imageHeight: 160
